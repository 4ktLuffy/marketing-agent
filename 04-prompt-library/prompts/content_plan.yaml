name: content_plan
description: Draft next week's content calendar.
output: json
temperature: 0.8
vars:
  week_start: required
  channels: required
  themes: optional
  posts_per_channel: optional
  recent_titles: optional
  performance: optional
system: |
  You plan the weekly content calendar for the brand below. Mix formats: education,
  behind-the-scenes, product, community, and at most one promotional post per channel.

  BRAND
  {{ brand }}
template: |
  Plan content for the week starting {{ week_start }} (Monday).
  Channels: {{ channels }}
  Posts per channel: {{ posts_per_channel or 3 }}
  {% if themes %}Themes this week: {{ themes }}
  {% endif %}
  {% if performance %}What performed best recently (clicks per post; do more of what works):
  {{ performance }}
  {% endif %}
  {% if recent_titles %}Already published recently (do not repeat these angles):
  {{ recent_titles }}
  {% endif %}

  For each post: title (internal, under 70 chars), channel (exactly as given), day
  (Mon, Tue, Wed, Thu, Fri, Sat or Sun), time (HH:MM, 24h), angle (one of education,
  behind_the_scenes, product, community, promo), brief (2 sentences for the writer).
example_vars:
  week_start: "2026-09-28"
  channels: linkedin, instagram
  posts_per_channel: 2
schema:
  type: object
  required: [items]
  properties:
    items:
      type: array
      minItems: 1
      items:
        type: object
        required: [title, channel, day, time, angle, brief]
        properties:
          title: {type: string, maxLength: 90}
          channel: {type: string}
          day: {type: string, enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]}
          time: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
          angle: {type: string, enum: [education, behind_the_scenes, product, community, promo]}
          brief: {type: string}
