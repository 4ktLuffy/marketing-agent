name: ad_copy
description: Search-ad headlines and descriptions within Google Ads limits.
output: json
temperature: 0.8
vars:
  product: required
  offer: optional
  audience: optional
  keywords: optional
  facts: optional
system: |
  You write performance ad copy for the brand below. Concrete benefits, no superlatives
  you cannot prove, no ALL CAPS, at most one exclamation mark per line.

  BRAND
  {{ brand }}
template: |
  Write Google responsive search ad assets.
  Product: {{ product }}
  {% if offer %}Offer: {{ offer }}
  {% endif %}
  {% if audience %}Audience: {{ audience }}
  {% endif %}
  {% if keywords %}Keywords to echo: {{ keywords }}
  {% endif %}

  {% if facts %}
  Approved facts about our products, prices and policies. These are the ONLY such facts you
  may state; if a detail is not here, do not state it, describe the experience instead.
  Do not copy the [f..] labels.
  {{ facts }}

  {% endif %}
  No numbers, dates, percentages or statistics unless they appear in the approved facts, the brand profile or the details above.
  "Proof" means a fact from the list above, never an invented number, rating or award.

  - 8 headlines, EACH AT MOST 30 CHARACTERS (count them). Vary angle: benefit, offer, proof, urgency, question.
  - 4 descriptions, EACH AT MOST 90 CHARACTERS.
example_vars:
  product: Coffee subscription for remote workers
  offer: First bag free
  keywords: coffee subscription, fresh roasted coffee
schema:
  type: object
  required: [headlines, descriptions]
  properties:
    headlines:
      type: array
      minItems: 5
      maxItems: 15
      items: {type: string, minLength: 5, maxLength: 30}
    descriptions:
      type: array
      minItems: 2
      maxItems: 4
      items: {type: string, minLength: 20, maxLength: 90}
