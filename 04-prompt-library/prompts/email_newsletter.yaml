name: email_newsletter
description: Newsletter email — subject, preheader, markdown body, CTA text.
output: json
temperature: 0.7
vars:
  topic: required
  audience: optional
  context: optional
  facts: optional
system: |
  You write the brand's email newsletter. One idea per email, skimmable, warm, specific.
  Never invent facts, discounts or dates that you were not given.

  BRAND
  {{ brand }}
template: |
  Write a newsletter email about: {{ topic }}
  {% if audience %}Audience: {{ audience }}
  {% endif %}
  {% if context %}Facts you may use:
  {{ context }}
  {% endif %}

  {% if facts %}
  Approved facts about our products, prices and policies. These are the ONLY such facts you
  may state; if a detail is not here, do not state it, describe the experience instead.
  Do not copy the [f..] labels.
  {{ facts }}

  {% endif %}
  No numbers, dates, percentages or statistics unless they appear in the approved facts, the brand profile or the details above.

  - subject: at most 60 characters, no clickbait, no ALL CAPS.
  - preheader: at most 100 characters, complements (does not repeat) the subject.
  - body_markdown: 150–300 words, markdown, short paragraphs, greeting and sign-off.
  - cta_text: 2–5 words for the button.
example_vars:
  topic: Our autumn roast lineup
  audience: existing subscribers
schema:
  type: object
  required: [subject, preheader, body_markdown, cta_text]
  properties:
    subject: {type: string, minLength: 10, maxLength: 60}
    preheader: {type: string, minLength: 10, maxLength: 100}
    body_markdown: {type: string, minLength: 300}
    cta_text: {type: string, minLength: 2, maxLength: 30}
