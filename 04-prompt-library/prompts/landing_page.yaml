name: landing_page
description: Landing page copy as JSON — hero, benefit blocks, social proof (a real consented customer quote copied exactly, or approved facts only), answer-first FAQ, CTA.
output: json
temperature: 0.7
vars:
  product: required
  audience: optional
  offer: optional
  context: optional
  facts: optional
  testimonials: optional
system: |
  You write landing page copy for the brand below. Clear beats clever: say what it is,
  who it is for and what to do next. No superlatives you cannot prove, no ALL CAPS.
  You never invent customer quotes, customer names, ratings, reviews, awards or statistics.

  BRAND
  {{ brand }}
template: |
  Write the copy for a landing page for: {{ product }}
  {% if audience %}Audience: {{ audience }}
  {% endif %}
  {% if offer %}Offer: {{ offer }}
  {% endif %}
  {% if context %}Facts you may use:
  {{ context }}
  {% endif %}

  {% if facts %}
  Approved facts about our products, prices and policies. These are the ONLY such facts you
  may state; if a detail is not here, do not state it, describe the experience instead.
  Do not copy the [f..] labels.
  {{ facts }}

  {% endif %}
  No numbers, dates, percentages or statistics unless they appear in the approved facts, the brand profile or the details above.

  Write every field in English unless the brand profile names another language.
  - headline: the hero headline, AT MOST 60 CHARACTERS (count them). The main benefit, plainly.
  - subheadline: one sentence, at most 160 characters, saying what it is and who it is for.
  - benefits: 3 or 4 blocks. "title" at most 40 characters; "text" 1-2 sentences. Build them
    from the approved facts about THIS product first (what is in it, how it ships, what it costs).
  {% if testimonials %}
  - social_proof: copy ONE of these real customer quotes EXACTLY as written here, with its
    quotation marks, the dash and its author, and nothing else:
  {{ testimonials }}
    Do not change, shorten, combine or add a single word. If none fits this page, write
    exactly: [add a customer quote]
  {% else %}
  - social_proof: we have NO customer quotes, reviews or ratings to give you. Write one
    sentence built only from an approved fact (for example a policy that lowers the risk
    of trying), or, if no fact fits, exactly: [add a customer quote]
    Never write a quote in quotation marks and never name a customer.
  {% endif %}
  - faq: 3 to 5 questions a buyer would type into a search engine or an AI assistant.
    Each answer starts with the direct answer in its first sentence ("Yes, ...", "No, ...",
    or the fact itself), then at most one sentence of detail. Only answer from the facts;
    if the facts do not answer a question, do not ask that question.
  - cta_text: the primary button text, 2 to 5 words.
example_vars:
  product: Team Box, a coffee subscription for remote teams
  audience: people-ops leads at remote companies
  offer: First box ships free
schema:
  type: object
  required: [headline, subheadline, benefits, social_proof, faq, cta_text]
  properties:
    headline: {type: string, minLength: 10, maxLength: 60}
    subheadline: {type: string, minLength: 20, maxLength: 160}
    benefits:
      type: array
      minItems: 3
      maxItems: 4
      items:
        type: object
        required: [title, text]
        properties:
          title: {type: string, minLength: 3, maxLength: 40}
          text: {type: string, minLength: 20, maxLength: 300}
    social_proof: {type: string, minLength: 10, maxLength: 250}
    faq:
      type: array
      minItems: 3
      maxItems: 5
      items:
        type: object
        required: [question, answer]
        properties:
          question: {type: string, minLength: 10, maxLength: 120}
          answer: {type: string, minLength: 10, maxLength: 350}
    cta_text: {type: string, minLength: 2, maxLength: 30}
