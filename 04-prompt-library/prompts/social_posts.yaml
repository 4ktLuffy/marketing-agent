name: social_posts
description: One native post per requested channel, as JSON.
output: json
temperature: 0.8
vars:
  topic: required
  channels: required
  link: optional
  context: optional
  campaign: optional
  examples: optional
  facts: optional
  prefer_hooks: optional
  customer_phrases: optional
  open_with: optional
  open_with_feedback: optional
system: |
  You are the social media manager for the brand below. Each channel gets a post written
  for that channel, not one post copied everywhere. No invented facts or statistics.

  BRAND
  {{ brand }}
template: |
  Write social posts about: {{ topic }}
  {% if campaign %}Campaign: {{ campaign }}
  {% endif %}
  {% if link %}Include this link once in each post: {{ link }}
  {% endif %}
  {% if context %}Facts you may use:
  {{ context }}
  {% endif %}

  {% if facts %}
  Approved facts about our products, prices and policies. These are the ONLY such facts you
  may state; if a detail is not here, do not state it, describe the experience instead.
  Do not copy the [f..] labels.
  {{ facts }}

  {% endif %}
  {% if customer_phrases %}
  Customers describe this in their own words as:
  {{ customer_phrases }}
  Reuse one of these phrases where it fits naturally; never put words in a customer's mouth or present them as a quote.

  {% endif %}
  {% if open_with %}
  The FIRST sentence of every post must contain this exact phrase, word for word: "{{ open_with }}". It is how customers say it. Build ONE grammatical sentence around it, with your own words before or after it, as if the words were yours.
  Two patterns that work (examples from a bike shop and a plant shop, not about us):
  - Words before it: "If your chain keeps slipping on wet mornings, a worn cassette is the usual cause."
  - Words after it: "Leaves turning yellow in winter usually means too much water, not too little."
  Never paste it on as a label or heading: no | : – — or line break right after it, no new sentence starting straight after it, and never as a sentence on its own ("Leaves turning yellow." or "chain keeps slipping Here is the fix" are wrong). Use normal sentence capitalization.
  Do not put it in quotation marks and do not attribute it to anyone: no customer names, no "a customer told us", no invented people, teams or companies.
  {% if open_with_feedback %}
  {{ open_with_feedback }}
  {% endif %}

  {% endif %}
  No numbers, dates, percentages or statistics unless they appear in the approved facts, the brand profile or the details above.

  {% set limits = {
    "x": "under 260 characters, 0-2 hashtags, punchy",
    "linkedin": "600-1200 characters, first line is a hook, short paragraphs, 3 hashtags at the end",
    "instagram": "under 1500 characters, visual language, up to 8 hashtags at the end",
    "facebook": "under 600 characters, conversational",
    "threads": "under 450 characters",
    "mastodon": "under 450 characters"} %}
  Write EXACTLY {{ channels.split(",") | length }} post(s), one per channel below, and no other channels:
  {% for c in channels.split(",") %}
  - channel "{{ c.strip().lower() }}": {{ limits.get(c.strip().lower(), "keep it short") }}
  {% endfor %}
  Count every character including the link. No flag emojis.

  {% if examples %}
  Posts our reviewer approved before (match their tone and structure, not their topics):
  {{ examples }}

  {% endif %}
  Put hashtags inside "text" where they belong AND list them (without #) in "hashtags".
  Pick "hook_style" before writing each post, then open the post that way: "question", "fact_led" (opens with an approved fact), "story", "how_to", "benefit" or "contrarian".
  {% if prefer_hooks %}
  Use one of these hook styles where it fits the channel: {{ prefer_hooks }}
  {% endif %}
example_vars:
  topic: New single-origin Colombian roast, limited batch
  channels: x, linkedin, instagram
  link: https://example.com/colombia
schema:
  type: object
  required: [posts]
  properties:
    posts:
      type: array
      minItems: 1
      items:
        type: object
        required: [channel, text, hashtags, hook_style]
        properties:
          channel: {type: string}
          hook_style:
            type: string
            enum: [question, fact_led, story, how_to, benefit, contrarian]
          text: {type: string, minLength: 20}
          hashtags:
            type: array
            items: {type: string}
