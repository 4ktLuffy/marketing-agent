name: customer_personas
description: 2-4 customer personas built only from mined themes and quotes; every attribute cites theme or quote ids, as JSON (70 customer-language).
output: json
temperature: 0.3
vars:
  themes: required
  n: required
# Used by 70-customer-language POST /personas. The service drops, in code, every attribute
# without a valid citation (a theme id like t3 or a quote id like q12 from the list), every
# "words_they_use" entry that is not an exact part of a cited quote, and any age or number
# not in the quotes; a label with a name or number that is not in the sources is replaced
# by "Persona N". No brand in the prompt: personas describe customers, not our messages.
system: |
  You are a customer researcher. You group what real customers said into a few personas.
  A persona here is a pattern of needs, not a character: you never give it a first name,
  an age, a gender, a job title, a location or a family that the quotes do not state.
template: |
  Themes mined from real customer reviews, searches and messages. Each theme has an id
  in brackets, then its quotes, each with its own id:

  {{ themes }}

  Build {{ n }} distinct personas from these themes only.
  For each persona:
  - "label": 2-5 plain words naming the pattern, e.g. "the team coffee organiser".
    No names, ages or places.
  - "goals", "pains", "objections": 1-3 items each. "text" is one short sentence in plain
    words; "cites" lists the theme ids and/or quote ids it comes from (at least one).
  - "words_they_use": 2-5 items. "text" is 2-8 words copied EXACTLY from one quote,
    and "cites" is that quote's id.
  Leave a list empty rather than write something no theme or quote supports.
example_vars:
  themes: |
    [t1] coffee arrives late (pain, 2 customers)
        [q1] Arrived two days late again
        [q2] my box arrived late twice this month
    [t2] never running out (outcome, 2 customers)
        [q3] I never run out now
        [q4] coffee subscription that doesn't run out
  n: 2
schema:
  type: object
  required: [personas]
  properties:
    personas:
      type: array
      minItems: 1
      maxItems: 4
      items:
        type: object
        required: [label, goals, pains, objections, words_they_use]
        properties:
          label: {type: string, maxLength: 80}
          goals:
            type: array
            maxItems: 6
            items:
              type: object
              required: [text, cites]
              properties:
                text: {type: string, maxLength: 240}
                cites:
                  type: array
                  items: {type: string, maxLength: 12}
          pains:
            type: array
            maxItems: 6
            items:
              type: object
              required: [text, cites]
              properties:
                text: {type: string, maxLength: 240}
                cites:
                  type: array
                  items: {type: string, maxLength: 12}
          objections:
            type: array
            maxItems: 6
            items:
              type: object
              required: [text, cites]
              properties:
                text: {type: string, maxLength: 240}
                cites:
                  type: array
                  items: {type: string, maxLength: 12}
          words_they_use:
            type: array
            maxItems: 6
            items:
              type: object
              required: [text, cites]
              properties:
                text: {type: string, maxLength: 240}
                cites:
                  type: array
                  items: {type: string, maxLength: 12}
