# WHY: "Pass guaranteed" and "DVSA-approved driving school" are forbidden phrasings (Pellow never guarantees a pass; DVSA approves instructors, not schools); RoSPA accreditation and "highest pass rate" have no source fact.
blocked: true
findings:
  - {contains: "Pass guaranteed or your next lesson is on us", label: forbidden_phrase, fact_key: first-time-pass-rate}
  - {contains: "Pellow is a DVSA-approved driving school you can trust", label: forbidden_phrase, fact_key: adi-instructors}
  - {contains: "RoSPA-accredited for advanced driver training", label: no_source, fact_key: null}
  - {contains: "Castlebrook's highest pass rate", label: no_source, fact_key: null}
must_not_flag:
  - "Manual lessons are £38 per hour"
  - "Book 10 hours of manual lessons for £350, paid in advance"
