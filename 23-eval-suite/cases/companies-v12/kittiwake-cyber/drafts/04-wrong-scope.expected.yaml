  - {contains: "keeps an eye on your alerts day and night, weekends included", label: wrong_scope, fact_key: round-the-clock-soc}
  - {contains: "Kittiwake Essentials: 24/7 monitoring for small teams", label: wrong_scope, fact_key: round-the-clock-soc}
