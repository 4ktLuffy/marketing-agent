name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

# Live evals need your Ollama. Run them on a self-hosted runner or by cron on the
# stack host:  python -m evalsuite.run --repeats 3 --min-pass-rate 0.8
