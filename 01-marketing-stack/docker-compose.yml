# Marketing agent: n8n + every service, on one docker network.
#
# Expects all deploy repos cloned side by side:
#   marketing-agent/01-marketing-stack   (this repo)
#   marketing-agent/03-llm-gateway
#   ...
# `scripts/clone-all.sh <github-user>` does that for you.
#
# Ollama runs on the host (Mac: native, uses Metal). Linux without host Ollama:
#   docker compose --profile ollama up -d   and set OLLAMA_URL=http://ollama:11434
#
# Install profiles (scripts/install.sh --profile <p>; INSTALL.md has what each one holds):
#   core   = services without a `profiles:` key: n8n, gateways, brand, knowledge base, research and
#            content tools, calendar, analytics, claim checker, campaigns, learning, status, control room
#   growth = core + services marked [growth, full]: content engine, bridges, analytics/GSC sync,
#            reviews, customer language, video, clips, paid ads, email flows
#   full   = growth + services marked [full]: ad library, site assistant, lead hub, AI visibility,
#            product feed optimizer
# COMPOSE_PROFILES in .env selects it for plain `docker compose` commands too.
# Extra, opt-in: --profile newsletter (self-hosted Listmonk), --profile ollama.
#
# Several clients on one host (agency mode, INSTALL.md "Several clients on one host"):
# `scripts/install.sh --client acme` runs this file as compose project "acme" with .env.acme.
# Host ports are 127.0.0.1:${PORT_PREFIX}NN (default 81NN) and ${N8N_PORT} (default 5678), so
# the single install keeps its ports and each client gets its own block (82NN, 83NN, ...).
# Built images carry a fixed name (marketing-agent-<service>), so every client uses the same
# images instead of building its own copy; data, networks and keys stay per project.

name: marketing-agent

x-service: &service
  restart: unless-stopped
  networks: [marketing]
  # Marks every container as this stack's: uninstall.sh --client acts only on containers whose
  # label names that client (MKT_CLIENT_ID, written by install.sh --client), never on another
  # compose project that happens to have the same name.
  labels:
    com.marketing-agent.client: ${MKT_CLIENT_ID:-single}
  extra_hosts: ["host.docker.internal:host-gateway"]

x-keyed: &keyed
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}

services:
  postgres:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      retries: 10

  n8n:
    <<: *service
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.40.5}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:${N8N_PORT:-5678}:5678"]
    # node is always in the image (wget is busybox, which n8n may drop); first start runs migrations.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_DATABASE: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Workflows read service URLs with {{ $env.X }}.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AGENT_MODEL: ${AGENT_MODEL:-mkt-agent}
      GATEWAY_URL: http://llm-gateway:8000
      BRAND_URL: http://brand-service:8000
      KB_URL: http://knowledge-base:8000
      EXTRACTOR_URL: http://page-extractor:8000
      RSS_URL: http://rss-watcher:8000
      MONITOR_URL: http://change-monitor:8000
      KEYWORDS_URL: http://keyword-suggest:8000
      LISTENING_URL: http://social-listening:8000
      SEO_URL: http://seo-auditor:8000
      READABILITY_URL: http://readability:8000
      RULES_URL: http://platform-rules:8000
      UTM_URL: http://utm-builder:8000
      SHORTENER_URL: http://link-shortener:8000
      CARDS_URL: http://image-cards:8000
      EMAIL_RENDER_URL: http://email-renderer:8000
      CALENDAR_URL: http://content-calendar:8000
      ANALYTICS_URL: http://analytics-ingest:8000
      REPORT_URL: http://report-builder:8000
      CLAIMS_URL: http://claim-checker:8000
      CAMPAIGNS_URL: http://campaign-service:8000
      LEARNING_URL: http://learning-service:8000
      # Services outside the core profile (growth/full): unset = their address in this stack,
      # empty = not installed, so the workflows that use them skip. install.sh writes the empty
      # ones into the managed block of .env for the profile you install (INSTALL.md, Profiles).
      UMAMI_SYNC_URL: ${UMAMI_SYNC_URL:-}
      REVIEWS_URL: ${REVIEWS_URL-http://review-hub:8000}
      ENGINE_URL: ${ENGINE_URL-http://content-engine:8000}
      NEWSLETTER_URL: ${NEWSLETTER_URL-http://listmonk-bridge:8000}
      GSC_URL: ${GSC_URL-http://gsc-sync:8000}
      VOC_URL: ${VOC_URL-http://customer-language:8000}
      VIDEO_URL: ${VIDEO_URL-http://video-assembly:8000}
      # Voice for video previews (57/65): piper | none. Empty = the video service's TTS_BACKEND.
      VIDEO_VOICE: ${VIDEO_VOICE:-}
      CLIPS_URL: ${CLIPS_URL-http://clip-finder:8000}
      LEADS_URL: ${LEADS_URL-http://lead-hub:8000}
      # Competitor registry + ads (78); empty = 37 watches pages only and 81 adds nothing.
      AD_LIBRARY_URL: ${AD_LIBRARY_URL-http://ad-library-sync:8000}
      # AI visibility (82) for workflow 83 and the weekly report line; empty = 83 does nothing.
      VISIBILITY_URL: ${VISIBILITY_URL-http://ai-visibility:8000}
      VISIBILITY_IDEAS_PER_WEEK: ${VISIBILITY_IDEAS_PER_WEEK:-5}
      # Paid ads (84): daily sync + alerts (84-ads-sync/n8n) and the weekly report's Ads section.
      ADS_URL: ${ADS_URL-http://ads-sync:8000}
      # Lifecycle email flows (86): review sync + due sends every 15 minutes (86-flow-runner/n8n).
      FLOW_URL: ${FLOW_URL-http://flow-runner:8000}
      # Tool 77 (clip_video): how long it waits for a clip job, and the most clips per video.
      CLIPS_MAX_WAIT_MIN: ${CLIPS_MAX_WAIT_MIN:-30}
      CLIPS_MAX_PER_VIDEO: ${CLIPS_MAX_PER_VIDEO:-5}
      NEWSLETTER_AUDIENCE: ${NEWSLETTER_AUDIENCE:-}
      # Publisher (39): blog items go to the CMS bridge (62), everything else to PUBLISH_WEBHOOK_URL.
      CMS_PUBLISH_URL: ${CMS_PUBLISH_URL-http://cms-bridge:8000/publish}
      CMS_PUBLISH_KEY: ${CMS_BRIDGE_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      APPROVER_KEY: ${APPROVER_KEY:?set APPROVER_KEY in .env}
      # The control room (72) posts decisions to webhook mkt-apply-decisions with this key.
      CONTROL_ROOM_KEY: ${CONTROL_ROOM_KEY:-}
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      LISTENING_QUERY: ${LISTENING_QUERY:-coffee subscription}
      PUBLISH_WEBHOOK_URL: ${PUBLISH_WEBHOOK_URL:-}
      PUBLISH_WEBHOOK_KEY: ${PUBLISH_WEBHOOK_KEY:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_FORMAT: ${NOTIFY_FORMAT:-generic}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      REPORT_EMAIL_TO: ${REPORT_EMAIL_TO:-}
      REPORT_EMAIL_FROM: ${REPORT_EMAIL_FROM:-}
      # Monthly client report (85): optional month override (YYYY-MM), money prefix, client name.
      CLIENT_REPORT_MONTH: ${CLIENT_REPORT_MONTH:-}
      REPORT_CURRENCY: ${REPORT_CURRENCY:-}
      CLIENT_NAME: ${CLIENT_NAME:-}
      PLAN_CHANNELS: ${PLAN_CHANNELS:-linkedin, x}
      PLAN_POSTS_PER_CHANNEL: ${PLAN_POSTS_PER_CHANNEL:-3}
      PLAN_THEMES: ${PLAN_THEMES:-}
      RECYCLE_MIN_CLICKS: ${RECYCLE_MIN_CLICKS:-5}
      RECYCLE_MIN_AGE_DAYS: ${RECYCLE_MIN_AGE_DAYS:-30}
      RECYCLE_PER_WEEK: ${RECYCLE_PER_WEEK:-2}
      REVIEW_REPLIES_PER_RUN: ${REVIEW_REPLIES_PER_RUN:-10}
      ENGINE_DRAFTS_PER_RUN: ${ENGINE_DRAFTS_PER_RUN:-12}
      ENGINE_LOOKAHEAD_DAYS: ${ENGINE_LOOKAHEAD_DAYS:-7}
      REFRESH_PER_WEEK: ${REFRESH_PER_WEEK:-3}
      REFRESH_MIN_CLICKS: ${REFRESH_MIN_CLICKS:-20}
      REFRESH_MIN_DROP: ${REFRESH_MIN_DROP:-0.3}
      SEO_BRIEFS_PER_WEEK: ${SEO_BRIEFS_PER_WEEK:-2}
      SEO_MIN_IMPRESSIONS: ${SEO_MIN_IMPRESSIONS:-100}
      SEO_MIN_POSITION: ${SEO_MIN_POSITION:-5}
      SEO_MAX_POSITION: ${SEO_MAX_POSITION:-20}
      SEO_AUDIENCE: ${SEO_AUDIENCE:-}
      # Experiment manager (74): channels it may test on (default PLAN_CHANNELS), proposals waiting at most.
      EXPERIMENT_CHANNELS: ${EXPERIMENT_CHANNELS:-}
      EXPERIMENT_MAX_PROPOSED: ${EXPERIMENT_MAX_PROPOSED:-2}
    volumes:
      - n8n_data:/home/node/.n8n
      # (no repo mount: import-n8n.sh streams each workflow in, so .env never enters n8n)

  llm-gateway:
    <<: *service
    image: marketing-agent-llm-gateway
    build: ../03-llm-gateway
    ports: ["127.0.0.1:${PORT_PREFIX:-81}03:8000"]
    environment:
      <<: *keyed
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      MODEL: ${WRITER_MODEL:-mkt-writer}
      ALLOWED_MODELS: ${GATEWAY_ALLOWED_MODELS:-}
      # Optional hosted model instead of Ollama for all writing/checking prompts.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
      PROMPTS_DIR: /prompts
      BRAND_URL: http://brand-service:8000
      LEARNING_URL: http://learning-service:8000
    volumes: ["../04-prompt-library/prompts:/prompts:ro"]

  brand-service:
    <<: *service
    image: marketing-agent-brand-service
    build: ../05-brand-service
    ports: ["127.0.0.1:${PORT_PREFIX:-81}05:8000"]
    environment:
      # Writes (PUT /voice, PUT /brand/editable from the control room's brand setup) need the key.
      <<: *keyed
      # brand.yaml stays read-only in /config; edits saved over it and the voice profile go to the
      # brand_data volume (/config is mounted read-only, so writing there fails).
      BRAND_OVERRIDES_FILE: /data/brand.overrides.json
      VOICE_FILE: /data/voice.json
    # A client of several (install.sh --client) gets its own copy in clients/<slug>/brand.
    volumes: ["${BRAND_CONFIG_DIR:-../05-brand-service/config}:/config:ro", "brand_data:/data"]

  knowledge-base:
    <<: *service
    image: marketing-agent-knowledge-base
    build: ../06-knowledge-base
    ports: ["127.0.0.1:${PORT_PREFIX:-81}06:8000"]
    environment:
      <<: *keyed
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
    volumes: [kb_data:/data]

  page-extractor:
    <<: *service
    image: marketing-agent-page-extractor
    build: ../07-page-extractor
    ports: ["127.0.0.1:${PORT_PREFIX:-81}07:8000"]

  rss-watcher:
    <<: *service
    image: marketing-agent-rss-watcher
    build: ../08-rss-watcher
    ports: ["127.0.0.1:${PORT_PREFIX:-81}08:8000"]
    environment: *keyed
    volumes: ["rss_data:/data", "${RSS_CONFIG_DIR:-../08-rss-watcher/config}:/config:ro"]

  change-monitor:
    <<: *service
    image: marketing-agent-change-monitor
    build: ../09-change-monitor
    ports: ["127.0.0.1:${PORT_PREFIX:-81}09:8000"]
    environment: *keyed
    volumes: [monitor_data:/data]

  keyword-suggest:
    <<: *service
    image: marketing-agent-keyword-suggest
    build: ../10-keyword-suggest
    ports: ["127.0.0.1:${PORT_PREFIX:-81}10:8000"]

  social-listening:
    <<: *service
    image: marketing-agent-social-listening
    build: ../11-social-listening
    ports: ["127.0.0.1:${PORT_PREFIX:-81}11:8000"]

  seo-auditor:
    <<: *service
    image: marketing-agent-seo-auditor
    build: ../12-seo-auditor
    ports: ["127.0.0.1:${PORT_PREFIX:-81}12:8000"]

  readability:
    <<: *service
    image: marketing-agent-readability
    build: ../13-readability
    ports: ["127.0.0.1:${PORT_PREFIX:-81}13:8000"]

  platform-rules:
    <<: *service
    image: marketing-agent-platform-rules
    build: ../14-platform-rules
    ports: ["127.0.0.1:${PORT_PREFIX:-81}14:8000"]

  utm-builder:
    <<: *service
    image: marketing-agent-utm-builder
    build: ../15-utm-builder
    ports: ["127.0.0.1:${PORT_PREFIX:-81}15:8000"]

  link-shortener:
    <<: *service
    image: marketing-agent-link-shortener
    build: ../16-link-shortener
    # The only service meant to face the internet: put a reverse proxy / tunnel in front.
    ports: ["127.0.0.1:${PORT_PREFIX:-81}16:8000"]
    environment:
      <<: *keyed
      BASE_URL: ${SHORT_LINK_BASE_URL:-http://localhost:8116}
    volumes: [links_data:/data]

  image-cards:
    <<: *service
    image: marketing-agent-image-cards
    build: ../17-image-cards
    ports: ["127.0.0.1:${PORT_PREFIX:-81}17:8000"]
    environment:
      <<: *keyed
      # Base of the card URLs (POST /cards). The approval form shows the image from here, so it
      # must be reachable from the reviewer's browser.
      PUBLIC_BASE_URL: ${CARDS_PUBLIC_URL:-http://localhost:8117}
    volumes: [cards_data:/data]

  email-renderer:
    <<: *service
    image: marketing-agent-email-renderer
    build: ../18-email-renderer
    ports: ["127.0.0.1:${PORT_PREFIX:-81}18:8000"]

  content-calendar:
    <<: *service
    image: marketing-agent-content-calendar
    build: ../19-content-calendar
    ports: ["127.0.0.1:${PORT_PREFIX:-81}19:8000"]
    environment:
      <<: *keyed
      # Second key for approve/publish: only n8n (approval form, publisher) has it.
      APPROVER_KEY: ${APPROVER_KEY:?set APPROVER_KEY in .env}
    volumes: [calendar_data:/data]

  analytics-ingest:
    <<: *service
    image: marketing-agent-analytics-ingest
    build: ../20-analytics-ingest
    ports: ["127.0.0.1:${PORT_PREFIX:-81}20:8000"]
    environment: *keyed
    volumes: [analytics_data:/data]

  report-builder:
    <<: *service
    image: marketing-agent-report-builder
    build: ../21-report-builder
    ports: ["127.0.0.1:${PORT_PREFIX:-81}21:8000"]

  status-page:
    <<: *service
    image: marketing-agent-status-page
    build: ../22-status-page
    ports: ["127.0.0.1:${PORT_PREFIX:-81}22:8000"]
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Services to poll; empty = all of them. install.sh sets it to the installed profile's.
      SERVICES: ${STATUS_SERVICES:-}

  # Separate gateway for fact checking, so checking can run on a stronger model than
  # writing. Measured on a fresh held-out set: local qwen2.5:7b caught 5/6 invented claims
  # and flagged 3/6 true ones; Groq gpt-oss-120b caught 6/6 and flagged 1/6.
  # Default: same provider/model as writing. Hybrid: VERIFIER_PROVIDER=openai in .env.
  llm-gateway-verifier:
    <<: *service
    image: marketing-agent-llm-gateway-verifier
    build: ../03-llm-gateway
    ports: ["127.0.0.1:${PORT_PREFIX:-81}47:8000"]
    environment:
      <<: *keyed
      LLM_PROVIDER: ${VERIFIER_PROVIDER:-ollama}
      MODEL: ${VERIFIER_MODEL:-mkt-writer}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
      PROMPTS_DIR: /prompts
    volumes: ["../04-prompt-library/prompts:/prompts:ro"]

  claim-checker:
    <<: *service
    image: marketing-agent-claim-checker
    build: ../44-claim-checker
    ports: ["127.0.0.1:${PORT_PREFIX:-81}44:8000"]
    environment:
      <<: *keyed
      GATEWAY_URL: http://llm-gateway-verifier:8000
      BRAND_URL: http://brand-service:8000
      KB_URL: http://knowledge-base:8000
      CHECK_MODE: ${CLAIM_CHECK_MODE:-lenient}

  campaign-service:
    <<: *service
    image: marketing-agent-campaign-service
    build: ../45-campaign-service
    ports: ["127.0.0.1:${PORT_PREFIX:-81}45:8000"]
    environment:
      <<: *keyed
      SHORTENER_URL: http://link-shortener:8000
      ANALYTICS_URL: http://analytics-ingest:8000
      CALENDAR_URL: http://content-calendar:8000
      # Experiments: slot -> calendar item from the content engine; approving one needs the approver key.
      ENGINE_URL: http://content-engine:8000
      APPROVER_KEY: ${APPROVER_KEY:?set APPROVER_KEY in .env}
    volumes: [campaigns_data:/data]

  learning-service:
    <<: *service
    image: marketing-agent-learning-service
    build: ../46-learning-service
    ports: ["127.0.0.1:${PORT_PREFIX:-81}46:8000"]
    environment:
      <<: *keyed
      GATEWAY_URL: http://llm-gateway:8000
      # /examples?by=performance ranks approved posts by their clicks (45 /insights/posts).
      CAMPAIGNS_URL: http://campaign-service:8000
    volumes: [learning_data:/data]

  # Real publishing: point PUBLISH_WEBHOOK_URL at http://postiz-bridge:8000/publish.
  # DRY_RUN=true until you have checked CHANNEL_MAP against GET /integrations.
  postiz-bridge:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-postiz-bridge
    build: ../54-postiz-bridge
    ports: ["127.0.0.1:${PORT_PREFIX:-81}54:8000"]
    environment:
      <<: *keyed
      POSTIZ_URL: ${POSTIZ_URL:-}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      CHANNEL_MAP: ${POSTIZ_CHANNEL_MAP:-{}}
      DRY_RUN: ${POSTIZ_DRY_RUN:-true}
      # Card URLs under CARDS_PUBLIC_URL are downloaded from the internal address instead.
      CARDS_PUBLIC_URL: ${CARDS_PUBLIC_URL:-http://localhost:8117}
      CARDS_URL: http://image-cards:8000
      # Video URLs under VIDEO_PUBLIC_URL (71) likewise; larger videos are left off the post.
      VIDEO_PUBLIC_URL: ${VIDEO_PUBLIC_URL:-http://localhost:8171}
      VIDEO_URL: http://video-assembly:8000
      # Clips of 73 (and their posters) under CLIPS_PUBLIC_URL likewise.
      CLIPS_PUBLIC_URL: ${CLIPS_PUBLIC_URL:-http://localhost:8173}
      CLIPS_INTERNAL_URL: http://clip-finder:8000
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-100}

  # Real analytics: set UMAMI_SYNC_URL=http://umami-sync:8000 to enable the daily sync (56).
  umami-sync:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-umami-sync
    build: ../55-umami-sync
    ports: ["127.0.0.1:${PORT_PREFIX:-81}55:8000"]
    environment:
      <<: *keyed
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_USERNAME: ${UMAMI_USERNAME:-}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD:-}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      CONVERSION_EVENT: ${UMAMI_CONVERSION_EVENT:-signup}
      ANALYTICS_URL: http://analytics-ingest:8000

  # Reviews inbox, proof bank (verbatim, consented testimonials) and reply context.
  # Never posts anywhere: a person posts every reply.
  review-hub:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-review-hub
    build: ../58-review-hub
    ports: ["127.0.0.1:${PORT_PREFIX:-81}58:8000"]
    environment:
      <<: *keyed
    volumes: [review_data:/data]

  # Content engine (61): pillar -> atoms -> a month of planned slots, novelty check, stop rule.
  # Writes nothing itself; n8n drafts against it and a person approves every piece.
  content-engine:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-content-engine
    build: ../61-content-engine
    ports: ["127.0.0.1:${PORT_PREFIX:-81}61:8000"]
    environment:
      <<: *keyed
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
      # Running experiments (45) whose arms the planner assigns to slots.
      CAMPAIGNS_URL: http://campaign-service:8000
    volumes: [engine_data:/data]

  # Blog items -> WordPress or Ghost, as drafts by default (62). The publisher sends blog
  # items to CMS_PUBLISH_URL=http://cms-bridge:8000/publish. DRY_RUN=true until checked.
  cms-bridge:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-cms-bridge
    build: ../62-cms-bridge
    ports: ["127.0.0.1:${PORT_PREFIX:-81}62:8000"]
    environment:
      CMS_BRIDGE_KEY: ${CMS_BRIDGE_KEY:-${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}}
      CMS: ${CMS:-wordpress}
      WP_URL: ${WP_URL:-}
      WP_USER: ${WP_USER:-}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-}
      WP_STATUS: ${WP_STATUS:-draft}
      GHOST_URL: ${GHOST_URL:-}
      GHOST_ADMIN_KEY: ${GHOST_ADMIN_KEY:-}
      GHOST_STATUS: ${GHOST_STATUS:-draft}
      ALLOWED_IMAGE_HOSTS: ${ALLOWED_IMAGE_HOSTS:-image-cards,localhost}
      DRY_RUN: ${CMS_DRY_RUN:-true}

  # Newsletter -> Listmonk as a DRAFT campaign (63); a person presses send in Listmonk.
  # n8n calls NEWSLETTER_URL/campaigns. DRY_RUN=true until checked against GET /lists.
  listmonk-bridge:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-listmonk-bridge
    build: ../63-listmonk-bridge
    ports: ["127.0.0.1:${PORT_PREFIX:-81}63:8000"]
    environment:
      <<: *keyed
      LISTMONK_URL: ${LISTMONK_URL:-http://listmonk:9000}
      LISTMONK_USER: ${LISTMONK_USER:-}
      LISTMONK_TOKEN: ${LISTMONK_TOKEN:-}
      LISTMONK_AUTH_MODE: ${LISTMONK_AUTH_MODE:-token}
      LISTMONK_LIST_IDS: ${LISTMONK_LIST_IDS:-}
      LISTMONK_PUBLIC_URL: ${LISTMONK_PUBLIC_URL:-http://localhost:9000}
      LISTMONK_FROM_EMAIL: ${LISTMONK_FROM_EMAIL:-}
      LISTMONK_TEMPLATE_ID: ${LISTMONK_TEMPLATE_ID:-}
      DRY_RUN: ${NEWSLETTER_DRY_RUN:-true}
      ALLOW_SCHEDULE: ${NEWSLETTER_ALLOW_SCHEDULE:-false}
      TEST_EMAILS: ${NEWSLETTER_TEST_EMAILS:-}

  # Google Search Console (67): declining pages (content refresh) and striking-distance
  # queries (SEO briefs). Key: secrets/gsc.json (gitignored); /health says configured:false without it.
  gsc-sync:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-gsc-sync
    build: ../67-gsc-sync
    ports: ["127.0.0.1:${PORT_PREFIX:-81}67:8000"]
    environment:
      <<: *keyed
      GSC_SITE_URL: ${GSC_SITE_URL:-}
      GSC_CREDENTIALS_FILE: /secrets/gsc.json
      ANALYTICS_URL: ${GSC_ANALYTICS_URL:-}
    volumes:
      - gsc_data:/data
      - ${SECRETS_DIR:-./secrets}:/secrets:ro

  # Customer language (70): phrases and themes customers repeat, mined from reviews (58),
  # Search Console queries (67) and imports; every quote is verbatim. Writers read /relevant.
  customer-language:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-customer-language
    build: ../70-customer-language
    ports: ["127.0.0.1:${PORT_PREFIX:-81}70:8000"]
    environment:
      <<: *keyed
      GATEWAY_URL: http://llm-gateway:8000
      REVIEWS_URL: http://review-hub:8000
      GSC_URL: http://gsc-sync:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
    volumes: [voc_data:/data]

  # Script -> vertical MP4 (71). Local only: Pillow frames, piper voice, ffmpeg.
  video-assembly:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-video-assembly
    build: ../71-video-assembly
    ports: ["127.0.0.1:${PORT_PREFIX:-81}71:8000"]
    environment:
      <<: *keyed
      DATA_DIR: /data
      # Base of the video URLs; the approval form links them, so the reviewer's browser must reach it.
      PUBLIC_BASE_URL: ${VIDEO_PUBLIC_URL:-http://localhost:8171}
      TTS_BACKEND: ${VIDEO_TTS_BACKEND:-piper}
      RETENTION_DAYS: ${VIDEO_RETENTION_DAYS:-0}
    volumes: [video_data:/data]

  # Mobile-first review queue, calendar and dashboards (72). It holds no APPROVER_KEY: decisions
  # go to n8n (webhook mkt-apply-decisions, same code as form 38). Bound to localhost; for a
  # phone, put it behind your HTTPS reverse proxy (72-control-room/README.md).
  control-room:
    <<: *service
    image: marketing-agent-control-room
    build: ../72-control-room
    ports: ["127.0.0.1:${PORT_PREFIX:-81}72:8000"]
    environment:
      <<: *keyed
      CONTROL_USER: ${CONTROL_USER:-approver}
      CONTROL_PASSWORD: ${CONTROL_PASSWORD:?set CONTROL_PASSWORD in .env}
      CONTROL_ROOM_KEY: ${CONTROL_ROOM_KEY:?set CONTROL_ROOM_KEY in .env}
      COOKIE_SECURE: ${CONTROL_COOKIE_SECURE:-auto}
      # Behind an HTTPS proxy, list its IPs/CIDRs so login rate limits see the visitor, not the proxy.
      TRUSTED_PROXIES: ${CONTROL_TRUSTED_PROXIES:-}
      UNDO_SECONDS: ${CONTROL_UNDO_SECONDS:-5}
      SESSION_HOURS: ${CONTROL_SESSION_HOURS:-12}
      SESSION_IDLE_MINUTES: ${CONTROL_SESSION_IDLE_MINUTES:-120}
      N8N_BASE_URL: http://n8n:5678
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      # Brand setup pages: edit the brand (05) and turn the voice interview into a profile (03).
      BRAND_URL: http://brand-service:8000
      GATEWAY_URL: http://llm-gateway:8000
      CALENDAR_URL: http://content-calendar:8000
      CAMPAIGNS_URL: http://campaign-service:8000
      LEARNING_URL: http://learning-service:8000
      # Growth-profile services: install.sh sets these empty on core, so the pages say "not installed".
      ENGINE_URL: ${ENGINE_URL-http://content-engine:8000}
      RULES_URL: http://platform-rules:8000
      STATUS_URL: http://status-page:8000
      CARDS_URL: http://image-cards:8000
      VIDEO_URL: ${VIDEO_URL-http://video-assembly:8000}
      CLIPS_URL: ${CLIPS_URL-http://clip-finder:8000}
      AD_LIBRARY_URL: ${AD_LIBRARY_URL-http://ad-library-sync:8000}
      ADS_URL: ${ADS_URL-http://ads-sync:8000}
      # Download of an item (a client report, 85) as one HTML file.
      REPORT_URL: http://report-builder:8000
      # Product feed page (87, full profile): uploads, counts and the exports.
      FEED_URL: ${FEED_URL-http://feed-optimizer:8000}
      # Activity page: more gateways to read (label=url; an empty url is skipped) and the profile.
      ACTIVITY_GATEWAYS: verifier=http://llm-gateway-verifier:8000,assistant=${ASSISTANT_GATEWAY_URL:-}
      INSTALL_PROFILE: ${COMPOSE_PROFILES-full}

  clip-finder:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-clip-finder
    build: ../73-clip-finder
    ports: ["127.0.0.1:${PORT_PREFIX:-81}73:8000"]
    environment:
      <<: *keyed
      DATA_DIR: /data
      GATEWAY_URL: http://llm-gateway:8000
      # Base of the clip URLs; the approval form links them, so the reviewer's browser must reach it.
      PUBLIC_BASE_URL: ${CLIPS_PUBLIC_URL:-http://localhost:8173}
      # The image ships faster-whisper small at this path (no download at run time).
      WHISPER_MODEL: ${WHISPER_MODEL:-/models/faster-whisper-small}
      RETENTION_DAYS: ${CLIPS_RETENTION_DAYS:-0}
    volumes: [clips_data:/data]

  # Competitor registry + ads (78): official Meta Ad Library API only (EU-delivered ads; the
  # token's user must have confirmed identity at facebook.com/ID). Google, LinkedIn and TikTok
  # are links for a person to open, never scraped. Active competitors' pages become 09 watches.
  ad-library-sync:
    <<: *service
    profiles: [full]
    image: marketing-agent-ad-library-sync
    build: ../78-ad-library-sync
    ports: ["127.0.0.1:${PORT_PREFIX:-81}78:8000"]
    environment:
      <<: *keyed
      META_AD_LIBRARY_TOKEN: ${META_AD_LIBRARY_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      # EU examples: Meta returns commercial ads only for ads delivered in the EU.
      AD_COUNTRIES: ${AD_COUNTRIES:-DE,FR,NL,IE}
      MONITOR_URL: http://change-monitor:8000
      REVIEWS_URL: http://review-hub:8000
      LISTENING_URL: http://social-listening:8000
      LISTENING_QUERY: ${LISTENING_QUERY:-coffee subscription}
      KB_URL: http://knowledge-base:8000
      OWN_DOMAINS: ${OWN_DOMAINS:-}
      # Positioning map (POST /positioning/build): approved facts from 05, prompt positioning_themes via 03.
      BRAND_URL: http://brand-service:8000
      GATEWAY_URL: http://llm-gateway:8000
    volumes: [ads_data:/data]

  # Hosted gateway for the website assistant's answers only (79 -> prompt site_answer), so
  # visitors wait seconds, not a minute. Idle unless ASSISTANT_GATEWAY_URL points 79 here.
  # Visitor messages and the matching knowledge-base excerpts go to this provider.
  llm-gateway-assistant:
    <<: *service
    profiles: [full]
    image: marketing-agent-llm-gateway-assistant
    build: ../03-llm-gateway
    ports: ["127.0.0.1:${PORT_PREFIX:-81}48:8000"]
    environment:
      <<: *keyed
      LLM_PROVIDER: openai
      MODEL: ${ASSISTANT_MODEL:-openai/gpt-oss-120b}
      OPENAI_BASE_URL: ${ASSISTANT_OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      OPENAI_API_KEY: ${ASSISTANT_OPENAI_API_KEY:-}
      REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-low}
      PROMPTS_DIR: /prompts
    volumes: ["../04-prompt-library/prompts:/prompts:ro"]

  # Website chat assistant (79): answers only from 06 + 05 facts, every answer claim-checked
  # (44), hands off to a person, leads to 80 only with consent. Bound to localhost: publish ONLY
  # /chat, /consent, /widget-config, /widget.js and /widget.css through your HTTPS reverse proxy,
  # never /admin (79-site-assistant/README.md).
  site-assistant:
    <<: *service
    profiles: [full]
    image: marketing-agent-site-assistant
    build: ../79-site-assistant
    ports: ["127.0.0.1:${PORT_PREFIX:-81}79:8000"]
    environment:
      <<: *keyed
      # Local gateway by default; http://llm-gateway-assistant:8000 for fast hosted answers.
      GATEWAY_URL: ${ASSISTANT_GATEWAY_URL:-http://llm-gateway:8000}
      # Whole answer (search + model + claim check); slower = handoff, never an unchecked answer.
      # Empty = automatic: 20 s with the hosted gateway, 120 s all-local (79 decides from the line below).
      ANSWER_TIMEOUT_S: ${ASSISTANT_ANSWER_TIMEOUT_S:-}
      ASSISTANT_GATEWAY_URL: ${ASSISTANT_GATEWAY_URL:-}
      BRAND_URL: http://brand-service:8000
      KB_URL: http://knowledge-base:8000
      CLAIMS_URL: http://claim-checker:8000
      LEADS_URL: ${SITE_LEADS_URL-http://lead-hub:8000}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      ALLOWED_ORIGINS: ${SITE_ALLOWED_ORIGINS:-}
      BOOKING_URL: ${BOOKING_URL:-}
      TRUST_PROXY: ${SITE_TRUST_PROXY:-false}
    volumes: [site_data:/data]

  # Lead hub (80): inbound leads (79, forms, webhooks) -> enrichment from the lead's OWN site via
  # 07 (robots.txt respected; no LinkedIn, no data brokers) -> score with reasons -> HubSpot/
  # Pipedrive -> first-reply draft a person approves and sends. Nothing leaves without consent,
  # and CRM calls stay dry runs until LEADS_DRY_RUN=false. Publish only /leads/webhook/* publicly.
  lead-hub:
    <<: *service
    profiles: [full]
    image: marketing-agent-lead-hub
    build: ../80-lead-hub
    ports: ["127.0.0.1:${PORT_PREFIX:-81}80:8000"]
    environment:
      <<: *keyed
      EXTRACTOR_URL: http://page-extractor:8000
      GATEWAY_URL: http://llm-gateway:8000
      CLAIMS_URL: http://claim-checker:8000
      CALENDAR_URL: http://content-calendar:8000
      DRY_RUN: ${LEADS_DRY_RUN:-true}
      RETENTION_DAYS: ${LEADS_RETENTION_DAYS:-365}
      WEBHOOK_SECRETS: ${LEADS_WEBHOOK_SECRETS:-}
      CRM: ${LEADS_CRM:-}
      HUBSPOT_TOKEN: ${HUBSPOT_TOKEN:-}
      HUBSPOT_TAG_PROPERTY: ${HUBSPOT_TAG_PROPERTY:-}
      PIPEDRIVE_TOKEN: ${PIPEDRIVE_TOKEN:-}
      PIPEDRIVE_BASE_URL: ${PIPEDRIVE_BASE_URL:-}
      PIPEDRIVE_NURTURE_LABEL_ID: ${PIPEDRIVE_NURTURE_LABEL_ID:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      BOOKING_URL: ${BOOKING_URL:-}
    volumes: [lead_data:/data]

  # AI visibility (82): approved buyer questions asked weekly to AI APIs (official only, never the
  # consumer apps); mentions, citations, list positions and share of voice vs the 78 registry, and
  # sentences about us checked by 44. Each provider is used only when its key is set (all empty
  # by default); daily call caps per provider. Gemini also needs VISIBILITY_GEMINI_TERMS_ACCEPTED.
  ai-visibility:
    <<: *service
    profiles: [full]
    image: marketing-agent-ai-visibility
    build: ../82-ai-visibility
    ports: ["127.0.0.1:${PORT_PREFIX:-81}82:8000"]
    environment:
      <<: *keyed
      BRAND_URL: http://brand-service:8000
      AD_LIBRARY_URL: http://ad-library-sync:8000
      GATEWAY_URL: http://llm-gateway:8000
      CLAIMS_URL: http://claim-checker:8000
      VIS_OPENAI_API_KEY: ${VISIBILITY_OPENAI_API_KEY:-}
      VIS_PERPLEXITY_API_KEY: ${VISIBILITY_PERPLEXITY_API_KEY:-}
      VIS_GEMINI_API_KEY: ${VISIBILITY_GEMINI_API_KEY:-}
      VIS_GEMINI_TERMS_ACCEPTED: ${VISIBILITY_GEMINI_TERMS_ACCEPTED:-false}
      VIS_GROQ_API_KEY: ${VISIBILITY_GROQ_API_KEY:-}
      VIS_OPENAI_DAILY_CALLS: ${VISIBILITY_OPENAI_DAILY_CALLS:-100}
      VIS_PERPLEXITY_DAILY_CALLS: ${VISIBILITY_PERPLEXITY_DAILY_CALLS:-100}
      VIS_GEMINI_DAILY_CALLS: ${VISIBILITY_GEMINI_DAILY_CALLS:-100}
      VIS_GROQ_DAILY_CALLS: ${VISIBILITY_GROQ_DAILY_CALLS:-200}
      VIS_SAMPLES: ${VISIBILITY_SAMPLES:-3}
      VIS_COUNTRY: ${VISIBILITY_COUNTRY:-}
      BRAND_ALIASES: ${VISIBILITY_BRAND_ALIASES:-}
      OWN_DOMAINS: ${OWN_DOMAINS:-}
      COMPETITOR_ALIASES: ${VISIBILITY_COMPETITOR_ALIASES:-}
    volumes: [visibility_data:/data]

  # Paid ads (84): spend, CPL, ROAS and pacing alerts from the Meta Marketing API and the Google
  # Ads API, READ-ONLY (nothing can change a budget or an ad). Every credential is empty by
  # default: /health says configured:false and the daily workflow does nothing until you set them.
  ads-sync:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-ads-sync
    build: ../84-ads-sync
    ports: ["127.0.0.1:${PORT_PREFIX:-81}84:8000"]
    environment:
      <<: *keyed
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_AD_ACCOUNT_IDS: ${META_AD_ACCOUNT_IDS:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      META_CONVERSION_ACTIONS: ${META_CONVERSION_ACTIONS:-lead}
      META_REVENUE_ACTIONS: ${META_REVENUE_ACTIONS:-omni_purchase}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_CUSTOMER_IDS: ${GOOGLE_ADS_CUSTOMER_IDS:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_API_VERSION: ${GOOGLE_ADS_API_VERSION:-v25}
      CAMPAIGNS_URL: http://campaign-service:8000
      ANALYTICS_URL: ${ADS_ANALYTICS_URL:-}
      ALERT_OVERSPEND_PCT: ${ADS_ALERT_OVERSPEND_PCT:-15}
      ALERT_UNDERSPEND_PCT: ${ADS_ALERT_UNDERSPEND_PCT:-25}
      ALERT_ZERO_CONV_DAYS: ${ADS_ALERT_ZERO_CONV_DAYS:-3}
    volumes: [ads_sync_data:/data]

  # Lifecycle email flows (86): welcome, onboarding and win-back emails from events, with a
  # randomised holdout, a daily cap and a kill switch. DRY_RUN is fixed to true here: a "send" is
  # a row in its outbox. Its real send path (listmonk-bridge /tx) is a stub; see its README.
  flow-runner:
    <<: *service
    profiles: [growth, full]
    image: marketing-agent-flow-runner
    build: ../86-flow-runner
    ports: ["127.0.0.1:${PORT_PREFIX:-81}86:8000"]
    environment:
      <<: *keyed
      # Approving a flow version and resuming after a pause need this second key (n8n has it).
      APPROVER_KEY: ${APPROVER_KEY:?set APPROVER_KEY in .env}
      DRY_RUN: "true"
      FLOW_DAILY_CAP: ${FLOW_DAILY_CAP:-200}
      FLOW_PAUSED: ${FLOW_PAUSED:-false}
      FLOW_HOLDOUT_PCT: ${FLOW_HOLDOUT_PCT:-15}
      CALENDAR_URL: http://content-calendar:8000
      GATEWAY_URL: http://llm-gateway:8000
      CLAIMS_URL: http://claim-checker:8000
      NEWSLETTER_URL: ${NEWSLETTER_URL-http://listmonk-bridge:8000}
    volumes: [flow_data:/data]

  # Product feed optimizer (87): better titles for a Google Merchant Center feed file. The model's
  # titles are checked in code against each product's own row; a person approves with the
  # approver key; the export is the uploaded file with only approved titles/descriptions changed.
  # Nothing is uploaded to Merchant Center.
  feed-optimizer:
    <<: *service
    profiles: [full]
    image: marketing-agent-feed-optimizer
    build: ../87-feed-optimizer
    ports: ["127.0.0.1:${PORT_PREFIX:-81}87:8000"]
    environment:
      <<: *keyed
      APPROVER_KEY: ${APPROVER_KEY:?set APPROVER_KEY in .env}
      GATEWAY_URL: http://llm-gateway:8000
      FEED_MAX_BYTES: ${FEED_MAX_BYTES:-10000000}
      FEED_MAX_ROWS: ${FEED_MAX_ROWS:-5000}
    volumes: [feed_data:/data]

  # Optional self-hosted Listmonk (AGPL): docker compose --profile newsletter up -d
  # Admin UI http://localhost:9000. Based on github.com/knadh/listmonk docker-compose.yml.
  listmonk:
    <<: *service
    image: listmonk/listmonk:${LISTMONK_VERSION:-latest}
    profiles: [newsletter]
    depends_on:
      listmonk-db: {condition: service_healthy}
    ports: ["127.0.0.1:${LISTMONK_PORT:-9000}:9000"]
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:-listmonk}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      TZ: ${TZ:-UTC}
      # Set both on the first start to create the admin user; otherwise set it up in the UI.
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-}
    volumes: [listmonk_uploads:/listmonk/uploads]

  listmonk-db:
    <<: *service
    image: postgres:17-alpine
    profiles: [newsletter]
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:-listmonk}
      POSTGRES_DB: listmonk
    volumes: [listmonk_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 5s
      retries: 10

  ollama:
    <<: *service
    image: ollama/ollama:latest
    profiles: [ollama]
    ports: ["127.0.0.1:${OLLAMA_PORT:-11434}:11434"]
    volumes: [ollama_data:/root/.ollama]

networks:
  # No fixed name: Compose calls it <project>_marketing ("marketing-agent_marketing" by default), so
  # two installs on one host (e.g. `docker compose -p client-a`) never share a network and a service
  # name like brand-service can't resolve to another install's container (docs/agency-mode.md).
  marketing: {}

volumes:
  pg_data:
  brand_data:
  cards_data:
  n8n_data:
  kb_data:
  rss_data:
  monitor_data:
  links_data:
  calendar_data:
  analytics_data:
  campaigns_data:
  learning_data:
  review_data:
  engine_data:
  listmonk_data:
  listmonk_uploads:
  gsc_data:
  voc_data:
  video_data:
  clips_data:
  ads_data:
  ads_sync_data:
  flow_data:
  feed_data:
  site_data:
  lead_data:
  visibility_data:
  ollama_data:
