name: headline
description: test prompt returning JSON
output: json
temperature: 0.2
vars:
  topic: required
  tone: optional
system: "Brand: {{ brand }}"
template: |
  Write headlines about {{ topic }}{% if tone %} in a {{ tone }} tone{% endif %}.
schema:
  type: object
  required: [headlines]
  properties:
    headlines:
      type: array
      minItems: 2
      items: {type: string}
