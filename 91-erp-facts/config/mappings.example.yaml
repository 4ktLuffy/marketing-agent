# Copy, edit, and point MAPPINGS_FILE at your copy (mount it read-only in Docker). Nothing here is read from the
# ERP unless it is listed under `fields`. Models with personal data (res.partner, res.users, hr.*,
# mail.*, account.move*, sale.order) are refused unless named under allow_models. Do not do that
# for prices.
#
# allow_models: []

mappings:
  # ---- Services: one product.template per plan, two prices per plan (list price public, cost internal) ----
  - name: service-plans
    model: product.template
    domain: [["type", "=", "service"]]
    fields: [name, default_code, list_price, standard_price, currency_id, company_id]
    subject: {kind: product, ref_template: "{name}"}
    fact_type: price
    attribute: price
    currency_field: currency_id                   # many2one to res.currency; its name is the ISO code
    unit: month
    basis: flat
    scope_fields: {sites: company_id}             # the company (many2one name) becomes the site scope
    skip_if:                                      # 0 or 1 is a placeholder price, never a fact
      - {field: value, op: "<=", value: 1}
    text_template: "{name} ({default_code}) costs {currency} {value_fmt} per month."
    outputs:
      - key_template: "price-{name|slug}-list"
        value_field: list_price
        sensitivity: public
        conditions: [{key: channel, op: "=", value: retail}]
        required_disclosures: ["excluding tax"]
      - key_template: "price-{name|slug}-cost"
        value_field: standard_price
        sensitivity: internal                      # internal costs never leave as text
        conditions: [{key: channel, op: "=", value: reseller}]

  # ---- Drinks distributor: price per crate in GBP; bottles per crate when the name says so ----
  - name: drink-crates
    model: product.template
    domain: [["company_id", "=", 3], ["sale_ok", "=", true]]
    fields: [name, list_price]
    subject: {kind: product, ref_template: "{name}"}
    fact_type: price
    attribute: price
    key_template: "price-{name|slug}-crate"
    value_field: list_price
    currency: GBP
    unit: crate
    basis: per_unit
    sensitivity: public
    skip_if:
      - {field: value, op: "<=", value: 1}
    derive:                                        # "Lemonade 24x33cl" -> pack_count 24, volume_cl 33
      - {from: name, regex: '(\d+)\s*x\s*(\d+)\s*cl', names: [pack_count, volume_cl]}
    text_variants:
      - requires: [pack_count, volume_cl]
        template: "{name} costs {currency} {value_fmt} per crate ({pack_count} bottles of {volume_cl}cl)."
    text_template: "{name} costs {currency} {value_fmt} per crate."
