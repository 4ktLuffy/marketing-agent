name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.deploy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deploy:
          - 03-llm-gateway
          - 04-prompt-library
          - 05-brand-service
          - 06-knowledge-base
          - 07-page-extractor
          - 08-rss-watcher
          - 09-change-monitor
          - 10-keyword-suggest
          - 11-social-listening
          - 12-seo-auditor
          - 13-readability
          - 14-platform-rules
          - 15-utm-builder
          - 16-link-shortener
          - 17-image-cards
          - 18-email-renderer
          - 19-content-calendar
          - 20-analytics-ingest
          - 21-report-builder
          - 22-status-page
          - 23-eval-suite
          - 44-claim-checker
          - 45-campaign-service
          - 46-learning-service
          - 54-postiz-bridge
          - 55-umami-sync
          - 58-review-hub
          - 61-content-engine
          - 62-cms-bridge
          - 63-listmonk-bridge
          - 67-gsc-sync
          - 70-customer-language
          - 71-video-assembly
          - 72-control-room
          - 73-clip-finder
          - 78-ad-library-sync
          - 79-site-assistant
          - 80-lead-hub
          - 82-ai-visibility
          - 84-ads-sync
          - 86-flow-runner
          - 87-feed-optimizer
          - 88-task-bridge
          - 89-mcp-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: ${{ matrix.deploy }}
      - run: python -m pytest -q
        working-directory: ${{ matrix.deploy }}

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every n8n workflow.json is valid
        run: |
          python3 - <<'PY'
          import glob, json
          files = sorted(glob.glob("*-wf-*/workflow.json") + glob.glob("[0-9][0-9]-*/n8n/workflow.json"))
          ids = set()
          for f in files:
              wf = json.load(open(f))
              names = {n["name"] for n in wf["nodes"]}
              assert len(wf["id"]) == 16 and wf["id"] not in ids, f
              ids.add(wf["id"])
              assert len(names) == len(wf["nodes"]), f"{f}: duplicate node names"
              for src, outs in wf["connections"].items():
                  assert src in names, f"{f}: unknown node {src}"
                  for kind in outs.values():
                      for branch in kind:
                          for c in branch:
                              assert c["node"] in names, f"{f}: unknown node {c['node']}"
          print(f"{len(files)} workflows ok")
          PY

  generator:
    name: workflows match tools/workflow-generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: regenerate every workflow deploy; the committed files must not change
        run: |
          python tools/workflow-generator/build.py
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: generator tests (Code-node logic as it ships)
        run: for t in tools/workflow-generator/tests/*.js; do node "$t"; done

  shared-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSRF guard copies are identical (07 is canonical; see its header)
        run: |
          set -e
          ref=$(md5sum 07-page-extractor/app/safe_http.py | cut -d' ' -f1)
          for f in 08-rss-watcher 09-change-monitor 12-seo-auditor 73-clip-finder 80-lead-hub; do
            got=$(md5sum "$f/app/safe_http.py" | cut -d' ' -f1)
            [ "$got" = "$ref" ] || { echo "$f/app/safe_http.py differs from 07's copy"; exit 1; }
          done
          echo "all copies identical"

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid for every install profile
        working-directory: 01-marketing-stack
        run: |
          cp .env.example .env
          for p in core growth full; do docker compose --profile "$p" config -q && echo "ok: $p"; done
      - name: shell scripts
        run: shellcheck -S warning 01-marketing-stack/scripts/*.sh 01-marketing-stack/tests/*.sh 02-ollama-models/scripts/*.sh
      - name: agency mode (client names, port blocks, flags, rendered ports/networks, cron shift)
        run: bash 01-marketing-stack/tests/test-clients.sh
