# Starter kit: Ethiopia, hospitality (hotels, lodges, guesthouses). Data, not code; applying
# creates DRAFT rules only. Source: _dev/research/night4-ethiopia.md sections 2 and 6 (read
# 2026-10-01). Marketing-hygiene prompts, NOT legal or tax advice. Confirm with your finance team.
label: Ethiopia - hospitality
description: Room rates with stated VAT and service charge, USD for foreign passport holders and ETB for residents, 24-hour times, no unsourced ratings or awards.
fact_types:
  - fact_type: price
    subject_kind: service
    attributes: [rate_etb, rate_usd, basis, vat_included, service_charge_included]
    example: "Standard room ETB 4,500 per room per night for residents, including 15% VAT and 10% service charge."
  - fact_type: policy
    subject_kind: policy
    attributes: [usd_for_foreign_passport, etb_for_residents, resident_id_rule, confirmed_by_finance]
    example: "Foreign passport holders pay in USD and residents in ETB; rule confirmed by finance."
  - fact_type: hours
    subject_kind: site
    attributes: [check_in_24h, check_out_24h, restaurant_hours_24h]
    example: "Check-in from 14:00, check-out by 11:00."
  - fact_type: claim
    subject_kind: site
    attributes: [rating_source, rating_value, review_count, retrieved_on]
    example: "Rated 4.3 on a named review site, 120 reviews, retrieved 2026-09-30."
  - fact_type: event
    subject_kind: offer
    attributes: [start_date, end_date, currency, tax_status]
    example: "Timket package valid 2027-01-17 to 2027-01-20, ETB, tax-inclusive."
claim_classes: [price_reference, comparative]
forbidden_phrasing:
  - phrase: star
    why: Star ratings must come from a named grading source held as a fact; do not imply one otherwise.
    claim_class: comparative
    needs: a claim fact naming the grading body and the rating
  - phrase: 5-star
    why: A star class is an official or third-party grading; unsourced use is misleading.
    claim_class: comparative
    needs: a claim fact naming the grading body and the rating
  - phrase: five star
    why: A star class is an official or third-party grading; unsourced use is misleading.
    claim_class: comparative
    needs: a claim fact naming the grading body and the rating
  - phrase: award-winning
    why: Awards must be named, dated and sourced.
    claim_class: comparative
    needs: a claim fact naming the award, year and awarding body
  - phrase: best hotel
    why: Superlatives can't be substantiated without a named source.
    claim_class: comparative
  - phrase: rated
    why: A rating figure needs a named review source, value and date.
    claim_class: comparative
    needs: a claim fact with rating source, value and retrieval date
  - phrase: from ETB
    why: A "from" rate must be genuinely bookable on the promoted dates and state its tax basis.
    claim_class: price_reference
    needs: a price fact with availability and VAT and service charge status
  - phrase: from $
    why: A "from" USD rate is for foreign passport holders only and must state its tax basis. Confirm with your finance team.
    claim_class: price_reference
    needs: a price fact with currency, guest type and VAT and service charge status
  - phrase: all inclusive
    why: Inclusions differ by rate; do not say what is included without a fact.
    needs: an inclusion fact scoped to the rate
required_disclosures:
  - when: a room rate is mentioned
    text: States whether 15% VAT and 10% service charge are included or added.
    claim_class: price_reference
  - when: a USD rate is mentioned
    text: USD rates apply to foreign passport holders; residents pay in ETB. Confirm with your finance team.
    claim_class: price_reference
  - when: a time is mentioned
    text: Use the 24-hour clock (for example 14:00); Ethiopian clock time differs by 6 hours.
