# Starter kit: Ethiopia, alcohol (beer, wine, spirits makers, distributors, bars). Data, not code;
# applying creates DRAFT rules only. Source: Food and Medicine Administration Proclamation
# No. 1112/2019, Art. 60 (English column of the official PDF), as summarised in
# _dev/research/night4-ethiopia.md (read 2026-10-01). Marketing-hygiene prompts, NOT legal advice.
# Rules resting on UNVERIFIED research say "needs legal check" in their why text.
#
# Recommendation for every business using this kit: hold ALL public alcohol copy for human review
# and never auto-publish it. Art. 60 has no stated B2B exemption; one-to-one trade messages are
# lower risk than public posts (inference, needs legal check).
#
# Channel rules (notes, not phrase matches): Art. 60(4) bans broadcast (TV/radio) alcohol
# advertising and Art. 60(5) bans billboard advertising. The EFDA drafted a social-media alcohol
# rule in May 2025; its status in Oct 2026 was NOT checked, assume it may be in force.
#
# Amharic wording of the under-21 warning: NOT supplied here. The owner must confirm the exact
# Amharic text before any Amharic alcohol copy is written.
label: Ethiopia - alcohol (beer, wine, spirits)
description: Alcohol advertising hygiene under Proclamation 1112/2019 Art. 60. All public copy held for human review, never auto-published; no broadcast or billboard; under-21 warning on every ad.
fact_types:
  - fact_type: policy
    subject_kind: business
    attributes: [licence_number, licence_expiry, licensing_authority]
    example: "Trading licence no. is on file and valid to 2027-06-30."
  - fact_type: spec
    subject_kind: product
    attributes: [abv_percent, volume, pack_size]
    example: "The lager is 4.8% ABV, 330 ml bottle, 24 per crate."
  - fact_type: price
    subject_kind: product
    attributes: [price_etb, basis, vat_status, valid_to]
    example: "A crate of 24 is ETB 1,200 including VAT, trade customers only."
  - fact_type: policy
    subject_kind: policy
    attributes: [minimum_age, warning_wording_en, warning_wording_am, owner_confirmed]
    example: "Minimum age 21. English warning as in Art. 60(1); Amharic wording confirmed by the owner on file."
  - fact_type: policy
    subject_kind: policy
    attributes: [approved_channels, private_trade_channels_only, legal_review_ref]
    example: "Trade price lists go by one-to-one message to licensed retailers; public posts need a legal review reference."
claim_classes: [regulated_health, result, comparative, price_reference]
forbidden_phrasing:
  - phrase: healthy
    why: Health or medicinal claims about alcohol must not be made. Art. 60 has no explicit health-claim clause in the text read; needs legal check.
    claim_class: regulated_health
  - phrase: good for you
    why: Health claims about an alcoholic drink are unsafe and misleading; needs legal check on the exact Art. 60 basis.
    claim_class: regulated_health
  - phrase: nutritious
    why: Nutrition or health-benefit framing for alcohol is misleading; needs legal check.
    claim_class: regulated_health
  - phrase: energy
    why: Energy or vitality claims link alcohol with health or performance; needs legal check.
    claim_class: regulated_health
  - phrase: boosts
    why: Boosts or boosting (energy, mood, immunity, stamina) is a health or performance claim; needs legal check.
    claim_class: regulated_health
  - phrase: medicinal
    why: Medicinal or therapeutic claims about alcohol must not be made; needs legal check.
    claim_class: regulated_health
  - phrase: cures
    why: Claims to cure or treat anything are health claims; needs legal check.
    claim_class: regulated_health
  - phrase: for students
    why: Appealing to minors or school audiences conflicts with the under-21 sale ban (Art. 18(2)) and the youth-event limits in Art. 60(3); needs legal check on the advertising basis.
  - phrase: kids
    why: Any appeal to minors or to under-21s is unsafe given the under-21 sale ban (Art. 18(2)); needs legal check on the advertising basis.
  - phrase: drink and drive
    why: Linking alcohol with driving is a safety risk and must not appear in copy; needs legal check.
  - phrase: designated driver
    why: Linking alcohol with driving is a safety risk and must not appear in copy; needs legal check.
  - phrase: for drivers
    why: Linking alcohol with driving is a safety risk and must not appear in copy; needs legal check.
  - phrase: behind the wheel
    why: Linking alcohol with driving is a safety risk and must not appear in copy; needs legal check.
  - phrase: health-conscious
    why: Health or wellness framing of a drink is a health claim; Art. 60 bars health claims in alcohol advertising (needs legal check).
  - phrase: before the match
    why: Linking alcohol with sport or performance conflicts with the ban on advertising at sporting places and sponsoring sports events (Art. 60(2), 60(3)); needs legal check on the wording.
  - phrase: lottery
    why: Art. 60(5) prohibits advertising alcohol by associating it with any lottery system.
  - phrase: raffle
    why: A raffle is a lottery-type tie-in; Art. 60(5) prohibits associating alcohol advertising with any lottery system (raffle reading needs legal check).
  - phrase: prize draw
    why: A prize draw is a lottery-type tie-in; Art. 60(5) prohibits associating alcohol advertising with any lottery system (prize-draw reading needs legal check).
  - phrase: win a
    why: Prize-linked wording ties the drink to a lottery-type promotion, barred by Art. 60(5) (reading needs legal check).
  - phrase: official beer of
    why: Art. 60(3) bars makers, importers and distributors of drinks over 10% ABV from sponsoring public and government holidays, exhibitions, sports, school and youth events. Beer is usually below 10%, but needs legal check per product.
  - phrase: proud sponsor of
    why: Sponsorship of holidays, sports, school or youth events is barred by Art. 60(3) for drinks over 10% ABV; needs legal check for lower-strength products.
  - phrase: presented by
    why: Event "presented by" wording is sponsorship; Art. 60(3) restricts sponsoring holidays, exhibitions, sports and youth events; needs legal check.
  - phrase: happy holidays from
    why: Brand-led holiday greetings can read as sponsoring a public holiday (Art. 60(3)); needs legal check, and keep brands off greetings.
  - phrase: sponsored by
    why: Sponsorship of public holidays, exhibitions, sports, school and youth events is restricted by Art. 60(3); needs legal check.
  - phrase: proud to sponsor
    why: Sponsorship of public holidays, exhibitions, sports, school and youth events is restricted by Art. 60(3); needs legal check.
  - phrase: we sponsor
    why: Sponsorship of public holidays, exhibitions, sports, school and youth events is restricted by Art. 60(3); needs legal check.
  - phrase: sponsoring the
    why: Sponsorship of public holidays, exhibitions, sports, school and youth events is restricted by Art. 60(3); needs legal check.
  - phrase: happy hour
    why: Public drink offers are promotional alcohol advertising; hold for review (no public discounts until counsel confirms; needs legal check).
    claim_class: price_reference
  - phrase: billboard
    why: Art. 60(5) prohibits alcohol advertising through billboards. Do not draft billboard copy.
  - phrase: tv advert
    why: Art. 60(4) prohibits broadcast (TV and radio) alcohol advertising. Do not draft broadcast scripts.
  - phrase: radio spot
    why: Art. 60(4) prohibits broadcast (TV and radio) alcohol advertising. Do not draft broadcast scripts.
required_disclosures:
  - when: any alcohol advertisement or public post (Art. 60(1)); the warning must be in writing or sound and must not be shrunk (Art. 60(2))
    text: Selling to persons under 21 is prohibited.
  - when: Amharic alcohol copy (owner must confirm the Amharic wording; it is not supplied by this kit)
    text: Owner to confirm the Amharic wording of the under-21 warning.
  - when: any alcohol copy is drafted (recommendation, not a statutory text)
    text: Draft only. Hold for human review; do not auto-publish.
