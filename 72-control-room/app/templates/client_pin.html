{% extends "client_base.html" %}
{% block main %}
<section class="login">
  <h1>Posts for your sign-off</h1>
  <p class="muted">Enter the 6-digit PIN you were sent separately from this link.</p>
  {% if error %}<p class="alert danger" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/c/{{ token }}" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>PIN <input name="pin" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" autocomplete="one-time-code" required></label>
    <button type="submit" class="btn primary big">Open</button>
  </form>
</section>
{% endblock %}
